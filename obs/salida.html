<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Terapia Espacial · Salida OBS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@700;800&family=Audiowide&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --espacio:#0B0B1A; --violeta:#7B2FF7; --magenta:#FF3DCB; --rayo:#FFF4C2; --blanco:#FFFFFF; --menta:#D6EFC7;
    --ft:'Orbitron', 'Arial Black', Arial, sans-serif; --fx:'Inter', Arial, sans-serif;
  }
  html,body{margin:0;padding:0;overflow:hidden;background:transparent;}
  #escena{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;}
  #fondoVerde{position:absolute;inset:0;background:#00FF00;display:none;}
  body.verde #fondoVerde{display:block;}
  .capa{position:absolute;inset:0;pointer-events:none;}

  /* ---------- ABDUCCIÓN ---------- */
  .abd{position:absolute;inset:0;}
  svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;}
  .grp{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .barra{position:absolute;box-sizing:border-box;border-radius:6px;background:var(--espacio);}
  .barra .linea{position:absolute;left:0;right:0;top:0;height:5px;background:var(--violeta);border-radius:6px 6px 0 0;}
  .barra .acento{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--magenta);border-radius:6px 0 0 6px;}
  .barra .icono{position:absolute;top:50%;transform:translateY(-50%);}
  .titulo{position:absolute;white-space:nowrap;font-family:var(--ft);font-weight:700;color:var(--blanco);letter-spacing:.02em;line-height:1;}
  .subbarra{position:absolute;border-radius:4px;background:var(--violeta);}
  .subtitulo{position:absolute;white-space:nowrap;font-family:var(--fx);font-weight:700;color:var(--blanco);letter-spacing:.08em;text-transform:uppercase;line-height:1;}
  .etiqueta{position:absolute;height:38px;padding:0 18px;display:flex;align-items:center;border-radius:4px;font-family:var(--ft);font-weight:700;font-size:21px;letter-spacing:.14em;white-space:nowrap;}
  .ilus{position:absolute;}
  .ufo{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;}
  .ufo svg{position:absolute;left:-140px;top:-100px;width:280px;height:150px;overflow:visible;}
  body:not(.verde) .ufo svg, body:not(.verde) svg.rayo{filter:drop-shadow(0 0 10px rgba(123,47,247,.85)) drop-shadow(0 0 22px rgba(255,244,194,.35));}

  /* ---------- ESPACIO (apertura/cierre) ---------- */
  .espacio{position:absolute;inset:0;background:var(--espacio);opacity:0;transition:opacity .6s;}
  .espacio.on{opacity:1;}
  .espacio canvas{position:absolute;left:0;top:0;animation:deriva 30s linear infinite;}
  @keyframes deriva{from{transform:translateX(0)}to{transform:translateX(-420px)}}

  /* ---------- VENTANAS (duplex / triplex) ---------- */
  .ventana{position:absolute;}
  .ventana svg{position:absolute;inset:-6px;overflow:visible;}
  .ventana rect{fill:none;}
  .etq{position:absolute;height:46px;display:flex;align-items:center;padding:0 22px 0 26px;background:var(--espacio);border-radius:4px;
       font-family:var(--ft);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--blanco);white-space:nowrap;
       opacity:0;transform:translateY(10px);transition:opacity .35s, transform .35s;}
  .etq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--magenta);border-radius:4px 0 0 4px;}
  .etq.on{opacity:1;transform:none;}
  .sesion{position:absolute;left:96px;top:54px;height:46px;display:flex;align-items:center;gap:14px;padding:0 18px 0 16px;background:var(--espacio);
       border:3px solid var(--violeta);border-radius:23px;font-family:var(--ft);font-weight:700;font-size:19px;letter-spacing:.12em;color:var(--blanco);
       opacity:0;transform:translateX(-30px);transition:opacity .4s, transform .5s;}
  .sesion.on{opacity:1;transform:none;}
  .sesion i{width:12px;height:12px;border-radius:50%;background:var(--magenta);animation:parpadeo 1s steps(1) infinite;}
  .sesion b{color:var(--rayo);font-weight:700;min-width:70px;}
  .sesion svg{width:90px;height:30px;}

  /* ---------- BUG ---------- */
  .bug{position:absolute;right:96px;top:54px;width:360px;height:112px;transform-origin:100% 0;}
  .bug .placa{position:absolute;inset:0;background:var(--espacio);border:4px solid var(--violeta);border-radius:56px;box-sizing:border-box;}
  .bug .l1,.bug .l2{position:absolute;left:120px;font-family:var(--ft);font-weight:700;font-size:30px;letter-spacing:.06em;line-height:1;white-space:nowrap;}
  .bug .l1{top:24px;color:var(--blanco);} .bug .l2{top:60px;color:var(--menta);}
  .bug img{position:absolute;left:110px;top:10px;height:92px;max-width:230px;object-fit:contain;}
  .bug .vivo{position:absolute;right:0;top:128px;height:38px;padding:0 18px 0 36px;border-radius:19px;background:var(--magenta);display:flex;align-items:center;
       font-family:var(--ft);font-weight:700;font-size:18px;letter-spacing:.12em;color:var(--blanco);}
  .bug .vivo::before{content:"";position:absolute;left:14px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--blanco);animation:parpadeo 1s steps(1) infinite;}
  @keyframes parpadeo{50%{opacity:.2}}
  .bug{transition:opacity .4s, transform .5s cubic-bezier(.2,1.4,.4,1);}
  .bug.fuera{opacity:0;transform:scale(.2) translateY(-60px);}

  /* ---------- TICKER ---------- */
  .ticker{position:absolute;left:0;right:0;bottom:18px;height:52px;background:var(--espacio);border-top:4px solid var(--violeta);
       display:flex;align-items:center;overflow:hidden;transform:translateY(90px);transition:transform .6s cubic-bezier(.3,1.3,.5,1);}
  .ticker.on{transform:none;}
  .ticker .etiq{position:relative;z-index:2;height:100%;padding:0 26px;display:flex;align-items:center;background:var(--magenta);
       font-family:var(--ft);font-weight:700;font-size:22px;letter-spacing:.1em;color:var(--blanco);white-space:nowrap;}
  .ticker .cinta{white-space:nowrap;font-family:var(--fx);font-weight:600;font-size:26px;color:var(--blanco);padding-left:40px;}

  /* ---------- CORTINA ---------- */
  .panelC{position:absolute;top:0;bottom:0;left:0;}
  .cortTexto{position:absolute;left:0;right:0;top:500px;text-align:center;font-family:var(--ft);font-weight:900;font-size:110px;letter-spacing:.06em;color:var(--blanco);opacity:0;}
</style>
</head>
<body class="verde">
<div id="escena">
  <div id="fondoVerde"></div>
  <div class="capa" id="cEspacio"></div>
  <div class="capa" id="cVentanas"></div>
  <div class="capa" id="cGraficas"></div>
  <div class="capa" id="cTicker"></div>
  <div class="capa" id="cBug"></div>
  <div class="capa" id="cCortina"></div>
</div>

<script src="comun.js"></script>
<script>
/* ===================================================================
   MOTOR DE ANIMACIÓN — replica las llaves del script de After Effects
   =================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
let E = TE.copia(TE.ESTADO_BASE);
const cfg = () => E.config;
const ahora = () => performance.now() / 1000;
const $ = (s, p = document) => p.querySelector(s);
function el(tag, cls, padre) { const e = document.createElement(tag); if (cls) e.className = cls; if (padre) padre.appendChild(e); return e; }
function sv(tag, attrs, padre) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (padre) padre.appendChild(e); return e; }
function ease(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function pista(keys, t, lineal) {
  if (t <= keys[0][0]) return keys[0][1];
  const u = keys[keys.length - 1]; if (t >= u[0]) return u[1];
  let i = 0; while (t > keys[i + 1][0]) i++;
  const [ta, va] = keys[i], [tb, vb] = keys[i + 1];
  let f = (t - ta) / (tb - ta); if (!lineal) f = ease(f);
  return Array.isArray(va) ? va.map((v, j) => v + (vb[j] - v) * f) : va + (vb - va) * f;
}
const esVerde = () => cfg().fondo !== 'transparente';
const COLOR_SECCION = { TALCA: ['var(--magenta)', 'var(--blanco)'], CHILE: ['var(--violeta)', 'var(--blanco)'], INTERNACIONAL: ['var(--rayo)', 'var(--espacio)'] };

/* ---------- dibujos ---------- */
function svgOvni() {
  const s = sv('svg', { viewBox: '-140 -100 280 150' });
  sv('ellipse', { cx: 0, cy: 0, rx: 125, ry: 37, fill: 'none', stroke: 'var(--violeta)', 'stroke-width': 6 }, s);
  sv('path', { d: 'M-64,-4 C-64,-46 -38,-78 0,-78 C38,-78 64,-46 64,-4 Z', fill: 'var(--espacio)', stroke: 'var(--blanco)', 'stroke-width': 6, 'stroke-linejoin': 'round' }, s);
  sv('ellipse', { cx: 0, cy: 0, rx: 116, ry: 29, fill: 'var(--espacio)', stroke: 'var(--blanco)', 'stroke-width': 6 }, s);
  sv('path', { d: 'M20,-60 C32,-58 42,-52 40,-40', fill: 'none', stroke: 'var(--blanco)', 'stroke-width': 5, 'stroke-linecap': 'round' }, s);
  const g = sv('g', { class: 'luces' }, s);
  [[-64, 6], [0, 13], [64, 6]].forEach(([x, y]) => sv('circle', { cx: x, cy: y, r: 7, fill: 'var(--magenta)' }, g));
  return s;
}
// Cabeza del paciente alienígena (dibujo original, línea blanca como el ovni)
function cabezaAlien(g, x, y, esc) {
  const h = sv('g', { transform: `translate(${x},${y}) scale(${esc})` }, g);
  sv('path', { d: 'M0,-46 C30,-46 44,-24 40,-2 C36,22 16,40 0,44 C-16,40 -36,22 -40,-2 C-44,-24 -30,-46 0,-46 Z', fill: 'var(--menta)', stroke: 'var(--blanco)', 'stroke-width': 5 }, h);
  sv('ellipse', { cx: -16, cy: 2, rx: 14, ry: 8, fill: 'var(--espacio)', transform: 'rotate(28 -16 2)' }, h);
  sv('ellipse', { cx: 16, cy: 2, rx: 14, ry: 8, fill: 'var(--espacio)', transform: 'rotate(-28 16 2)' }, h);
  sv('circle', { cx: -19, cy: -1, r: 3, fill: 'var(--blanco)' }, h);
  sv('circle', { cx: 13, cy: -1, r: 3, fill: 'var(--blanco)' }, h);
  sv('path', { d: 'M-6,26 Q0,30 6,26', fill: 'none', stroke: 'var(--espacio)', 'stroke-width': 3, 'stroke-linecap': 'round' }, h);
  return h;
}
function svgCabeza(tam) {
  const s = sv('svg', { viewBox: '-50 -52 100 100', width: tam, height: tam });
  cabezaAlien(s, 0, 0, 1);
  return s;
}
// Paciente en el diván con burbuja de pensamiento
function svgPaciente() {
  const s = sv('svg', { viewBox: '-230 -230 460 320', width: 460, height: 320 });
  const W = { stroke: 'var(--blanco)', 'stroke-width': 5, 'stroke-linejoin': 'round' };
  // burbuja
  const b = sv('g', { class: 'burbuja' }, s);
  sv('circle', Object.assign({ cx: -46, cy: -118, r: 7, fill: 'var(--espacio)' }, W), b);
  sv('circle', Object.assign({ cx: -22, cy: -146, r: 11, fill: 'var(--espacio)' }, W), b);
  sv('ellipse', Object.assign({ cx: 40, cy: -182, rx: 62, ry: 36, fill: 'var(--espacio)' }, W), b);
  const tx = sv('text', { x: 40, y: -168, 'text-anchor': 'middle', 'font-weight': 900, 'font-size': 44, style: 'font-family:var(--ft)', fill: 'var(--rayo)' }, b);
  tx.textContent = '?';
  // diván
  sv('path', Object.assign({ d: 'M-196,40 C-206,-30 -188,-70 -150,-70 L-128,-70 L-128,40 Z', fill: 'var(--violeta)' }, W), s);
  sv('rect', Object.assign({ x: -200, y: 18, width: 396, height: 46, rx: 18, fill: 'var(--violeta)' }, W), s);
  sv('rect', Object.assign({ x: -132, y: -8, width: 300, height: 32, rx: 14, fill: 'var(--magenta)' }, W), s);
  sv('rect', Object.assign({ x: 164, y: -22, width: 40, height: 70, rx: 16, fill: 'var(--violeta)' }, W), s);
  sv('path', { d: 'M-170,64 L-180,88 M170,64 L180,88', stroke: 'var(--blanco)', 'stroke-width': 6, 'stroke-linecap': 'round' }, s);
  // cuerpo recostado
  sv('path', Object.assign({ d: 'M-70,-14 C-40,-44 80,-44 140,-26 C156,-20 156,-6 140,-4 C80,4 -40,6 -70,-14 Z', fill: 'var(--menta)' }, W), s);
  sv('path', { d: 'M10,-30 C20,-6 40,-4 54,-12', fill: 'none', stroke: 'var(--blanco)', 'stroke-width': 5, 'stroke-linecap': 'round' }, s);
  cabezaAlien(s, -110, -46, 1.05).setAttribute('transform', 'translate(-110,-46) scale(1.05) rotate(-62)');
  return s;
}
function ondaPath(ancho, alto, picos) {
  let d = `M0,${alto / 2}`; const n = picos, paso = ancho / n;
  for (let i = 0; i < n; i++) {
    const x = i * paso;
    d += ` L${x + paso * .35},${alto / 2} L${x + paso * .45},${alto * .1} L${x + paso * .55},${alto * .9} L${x + paso * .65},${alto / 2}`;
  }
  return d + ` L${ancho},${alto / 2}`;
}

/* ===================================================================
   ABDUCCIÓN: ovni cae → rayo → GC baja por el rayo; salida lo absorbe
   =================================================================== */
class Abduccion {
  constructor(o, capa) {
    this.o = o;
    this.S = o.S || 100;
    this.barH = Math.round(o.tamT * 1.65);
    this.subH = Math.round(o.tamS * 1.7);
    this.mT = Math.round(o.tamT * .75);
    this.mS = Math.round(o.tamS * .9);
    this.icoW = o.paciente ? Math.round(this.barH * .9) : 0;
    this.ufoY = o.barY - this.barH / 2 - o.rayoLargo - 20 * this.S / 100;
    this.hoverY = o.barY - this.barH / 2 - 18 * this.S / 100;
    this.el = el('div', 'abd', capa);

    // rayo
    this.svg = sv('svg', { class: 'full rayo', viewBox: '0 0 1920 1080' }, this.el);
    this.cono = sv('polygon', { 'stroke-width': 5, 'stroke-linejoin': 'round' }, this.svg);
    this.nucleo = sv('polygon', {}, this.svg);
    this.lineas = [-.25, 0, .25].map(() => sv('line', { 'stroke-width': 3 }, this.svg));
    this.anillos = [0, 1, 2, 3, 4].map(() => sv('ellipse', { fill: 'none', 'stroke-width': 4 }, this.svg));

    // grupo barra + textos
    this.grp = el('div', 'grp', this.el);
    if (o.logo) { this.ilus = el('img', 'ilus', this.grp); this.ilus.src = o.logo; this.ilus.style.maxHeight = '240px'; }
    else if (o.ilustracion === 'paciente') { this.ilus = el('div', 'ilus', this.grp); this.ilus.appendChild(svgPaciente()); }
    this.barra = el('div', 'barra', this.grp);
    el('div', 'linea', this.barra); el('div', 'acento', this.barra);
    if (o.paciente) { const ic = svgCabeza(this.icoW); ic.classList.add('icono'); ic.style.left = (this.mT * .5 + 6) + 'px'; this.barra.appendChild(ic); }
    this.sub = el('div', 'subbarra', this.grp);
    if (o.etiqueta) {
      this.etq = el('div', 'etiqueta', this.grp);
      const c = COLOR_SECCION[o.etiqueta] || COLOR_SECCION.CHILE;
      this.etq.style.background = c[0]; this.etq.style.color = c[1];
      this.etq.textContent = o.etiqueta;
    }
    this.tit = el('div', 'titulo', this.grp);
    this.stx = el('div', 'subtitulo', this.grp);
    this.fs = o.tamT;
    this.tit.style.fontSize = o.tamT + 'px';
    this.stx.style.fontSize = o.tamS + 'px';
    if (o.colorBarra) this.barra.style.background = o.colorBarra;
    if (o.colorAcento) this.barra.querySelector('.acento').style.background = o.colorAcento;
    if (o.colorSub) { this.sub.style.background = o.colorSub; this.barra.querySelector('.linea').style.background = o.colorSub; }
    this.textos(o.titulo, o.sub);

    // ovni
    this.ufo = el('div', 'ufo', this.el);
    this.ufo.appendChild(svgOvni());

    this.fase = 'entrada';
    this.tFase = ahora() + (o.retraso || 0);
    Abduccion.vivos.add(this);
    this.fin = new Promise(r => (this._resolver = r));
    this.render(-1);
  }
  textos(t, s) {
    if (this.tit.textContent !== (t || '')) { this.tit.textContent = t || ''; this.fs = this.o.tamT; this.tit.style.fontSize = this.fs + 'px'; }
    this.stx.textContent = (s || '').toUpperCase();
  }
  salir() {
    if (this.fase === 'salida' || this.fase === 'fin') return this.fin;
    if (this.fase === 'entrada') { this.salidaPendiente = true; return this.fin; }
    this.fase = 'salida'; this.tFase = ahora();
    return this.fin;
  }
  valores(t) {
    const S = this.S, uY = this.ufoY, hY = this.hoverY, bY = this.o.barY, m = 40 * S / 100;
    if (this.fase === 'entrada') {
      return {
        rx: pista([[0, -1500], [.7, 0]], t), uy: pista([[0, uY - 500], [.7, uY], [1.9, uY], [2.5, hY]], t),
        us: pista([[0, .4 * S], [.7, S], [1.9, S], [2.5, .5 * S]], t), rot: pista([[0, -25], [.7, 0]], t),
        lado: pista([[1.9, 0], [2.5, 1]], t), k: pista([[.7, 0], [1, 1], [1.6, 1], [1.85, 0]], t),
        gy: pista([[.95, uY + m], [1.45, bY]], t), gs: pista([[.95, .08], [1.45, 1]], t),
        bo: pista([[.95, 0], [1.05, 1]], t, true), to: pista([[1.3, 0], [1.36, 1], [1.42, .25], [1.5, 1]], t, true),
        uo: (!cfg().ovniPausa && t > 2.0) ? Math.max(0, 1 - (t - 2.0) / .3) : 1, dir: 1
      };
    }
    if (this.fase === 'pausa') {
      return { rx: 0, uy: hY, us: .5 * S, rot: 0, lado: 1, k: 0, gy: bY, gs: 1, bo: 1, to: 1, uo: cfg().ovniPausa ? 1 : 0, dir: 1 };
    }
    return {
      rx: pista([[1.6, 0], [2.0, 1500]], t), uy: pista([[0, hY], [.5, uY], [1.6, uY], [2.0, uY - 500]], t),
      us: pista([[0, .5 * S], [.5, S], [1.6, S], [2.0, .4 * S]], t), rot: pista([[1.6, 0], [2.0, 20]], t),
      lado: pista([[0, 1], [.5, 0]], t), k: pista([[.5, 0], [.8, 1], [1.4, 1], [1.6, 0]], t),
      gy: pista([[.85, bY], [1.4, uY + m]], t), gs: pista([[.85, 1], [1.4, .05]], t),
      bo: pista([[1.25, 1], [1.4, 0]], t, true), to: pista([[1.1, 1], [1.25, 0]], t, true),
      uo: cfg().ovniPausa ? 1 : Math.min(1, t / .3), dir: -1
    };
  }
  tick(now) {
    let t = (now - this.tFase) * cfg().velocidad;
    if (t < 0) { this.render(-1); return; }
    if (this.fase === 'entrada' && t >= 2.5) {
      this.fase = this.salidaPendiente ? 'salida' : 'pausa'; this.tFase = now; t = 0;
      if (this.o.auto && !this.salidaPendiente) this.timerAuto = setTimeout(() => this.salir(), this.o.auto * 1000 / cfg().velocidad);
    }
    if (this.fase === 'salida' && t >= 2.0) { this.destruir(); return; }
    this.render(t);
  }
  render(t) {
    if (t < 0) { this.el.style.visibility = 'hidden'; return; }
    this.el.style.visibility = 'visible';
    const v = this.valores(t), o = this.o, c = cfg(), now = ahora(), b = c.bamboleo;
    let wt = this.tit.offsetWidth;
    // si el titular es muy largo, se achica la letra hasta caber
    if (o.maxW && wt + this.mT * 2 + this.icoW > o.maxW && wt > 0) {
      this.fs = Math.max(24, Math.floor(this.fs * (o.maxW - this.mT * 2 - this.icoW) / wt));
      this.tit.style.fontSize = this.fs + 'px'; wt = this.tit.offsetWidth;
    }
    const ws0 = this.stx.offsetWidth;
    const w = Math.max(wt + this.mT * 2 + this.icoW, o.minW || 360);
    const ws = ws0 > 2 ? ws0 + this.mS * 2 : 0;
    const cx = o.centrado ? 960 : c.bordeIzq + w / 2;
    const barH = this.barH, subH = this.subH, subY = barH / 2 + subH / 2 + 6;

    this.grp.style.transform = `translate(${cx}px,${v.gy}px) scale(${v.gs})`;
    Object.assign(this.barra.style, { left: -w / 2 + 'px', top: -barH / 2 + 'px', width: w + 'px', height: barH + 'px', opacity: v.bo });
    const sx = o.centrado ? -ws / 2 : -w / 2;
    Object.assign(this.sub.style, { left: sx + 'px', top: subY - subH / 2 + 'px', width: ws + 'px', height: subH + 'px', opacity: ws ? v.bo : 0 });
    const tx0 = o.centrado && o.maxW ? -wt / 2 + this.icoW / 2 : -w / 2 + this.mT + this.icoW;
    Object.assign(this.tit.style, { left: tx0 + 'px', top: (-this.fs * .5) + 'px', opacity: v.to });
    Object.assign(this.stx.style, { left: (sx + this.mS) + 'px', top: (subY - o.tamS * .5) + 'px', opacity: v.to });

  const actual = slots[nombre];
  if (actual && actual.clave === clave) return;
  slots[nombre] = { clave, pieza: null };
  if (actual && actual.pieza) await actual.pieza.salir();
  if (slots[nombre].clave !== clave) return;
  if (clave !== null && clave !== false) slots[nombre].pieza = crear();
}

function aplicarConfig() {
  const c = cfg(), r = document.documentElement.style;
  for (const k in c.colores) r.setProperty('--' + k, c.colores[k]);
  r.setProperty('--ft', `'${c.fuenteTitulo}', 'Arial Black', Arial, sans-serif`);
  r.setProperty('--fx', `'${c.fuenteTexto}', Arial, sans-serif`);
  document.body.classList.toggle('verde', esVerde());
  pintarBug();
}

function aplicar(nuevo) {
  E = TE.mezclar(TE.copia(TE.ESTADO_BASE), nuevo);
  aplicarConfig();
  const a = E.aire, tx = E.textos;
  // GC (y paciente)
  const g = a.gc !== null && a.gc !== undefined ? E.gcs[a.gc] : null;
  const claveGC = g ? a.gc + '|' + !!g.paciente : null;
  if (slots.gc && slots.gc.pieza && g && slots.gc.clave === claveGC) {
    slots.gc.pieza.textos(g.titulo, g.sub);
  } else {
    cambiarSlot('gc', claveGC, () => new Abduccion(Object.assign(conf(g.paciente ? 'paciente' : 'gc'), g), $('#cGraficas')));
  }
  // Avance informativo: -1 = portada, 0..n = titular
  const ti = a.titular;
  const claveT = ti === null || ti === undefined ? null : (ti < 0 ? 'portada' : 't' + ti);
  if (slots.titular && slots.titular.pieza && slots.titular.clave === claveT) {
    if (ti < 0) slots.titular.pieza.textos(tx.avance.titulo, tx.avance.sub);
    else if (E.titulares[ti]) slots.titular.pieza.textos(E.titulares[ti].texto, '');
  } else {
    cambiarSlot('titular', claveT, () => {
      if (ti < 0) return new Abduccion(Object.assign(conf('avance'), { titulo: tx.avance.titulo, sub: tx.avance.sub }), $('#cGraficas'));
      const h = E.titulares[ti] || { seccion: '', texto: '' };
      return new Abduccion(Object.assign(conf('titular'), { titulo: h.texto, sub: '', etiqueta: (h.seccion || '').toUpperCase() }), $('#cGraficas'));
    });
  }
  ['cortinaTitulo', 'aviso', 'volvemos'].forEach(n => {
    const on = !!a[n], t = tx[n];
    if (on && slots[n] && slots[n].pieza) { slots[n].pieza.textos(t.titulo, t.sub); return; }
    cambiarSlot(n, on ? n : null, () => new Abduccion(Object.assign(conf(n), { titulo: t.titulo, sub: t.sub }), $('#cGraficas')));
  });
  ['triplex', 'duplex'].forEach(n => {
    const t = tx[n];
    const clave = a[n] ? n + '|' + t.titulo + '|' + t.etiquetas.join(',') : null;
    cambiarSlot(n, clave, () => new Multiplex(VENTANAS[n], t.etiquetas, t.titulo));
  });
  bug(!!a.bug);
  ticker(!!a.ticker);
}

async function disparar(que, variante) {
  const tx = E.textos;
  if (que === 'cortina') return cortina();
  if (que === 'transicion') return transicion(variante);
  if (que === 'apertura' || que === 'cierre') {
    espacio(true);
    const p = new Abduccion(Object.assign(conf(que), { titulo: tx[que].titulo, sub: tx[que].sub }), $('#cGraficas'));
    await p.fin;
    espacio(false);
  }
  if (que === 'limpiar') Abduccion.vivos.forEach(p => p.salir());
}

/* ===================================================================
   BUCLE Y CONEXIÓN
   =================================================================== */
function bucle() {
  const now = ahora();
  Abduccion.vivos.forEach(p => p.tick(now));
  document.querySelectorAll('.ufo[data-bug]').forEach(u => {
    u.style.transform = `translate(58px,${58 + Math.sin(now * 3) * 5}px) rotate(${Math.sin(now * 2.2) * 6}deg) scale(.4)`;
    const l = u.querySelector('.luces'); if (l) l.style.opacity = Math.floor(now * 4) % 2 ? .35 : 1;
  });
  requestAnimationFrame(bucle);
}
function ajustar() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#escena').style.transform = `scale(${s})`;
}
addEventListener('resize', ajustar);

const vistos = new Set();
TE.escuchar(m => {
  if (!m || (m.id && vistos.has(m.id))) return;
  if (m.id) { vistos.add(m.id); if (vistos.size > 200) vistos.clear(); }
  if (m.tipo === 'estado') aplicar(m.estado);
  if (m.tipo === 'disparar') disparar(m.que, m.variante);
});

(async function iniciar() {
  ajustar();
  const ini = await TE.estadoInicial();
  ini.aire = Object.assign({}, TE.ESTADO_BASE.aire, { bug: ini.aire && ini.aire.bug, ticker: ini.aire && ini.aire.ticker });
  aplicar(ini);
  TE.conectar();
  bucle();
  if (new URLSearchParams(location.search).has('demo')) {
    const d = TE.copia(E); d.aire.gc = 0; d.aire.bug = true; aplicar(d);
  }
})();
</script>
