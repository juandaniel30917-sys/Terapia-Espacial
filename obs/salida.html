<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entre Ovnis y Fantasmas · Salida OBS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@700;800&family=Audiowide&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&family=Montserrat:wght@600;700;800&family=Cinzel:wght@600;700;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --espacio:#0B0B1A; --violeta:#7B2FF7; --magenta:#FF3DCB; --rayo:#FFF4C2; --blanco:#FFFFFF; --menta:#D6EFC7;
    --ft:'Orbitron', 'Arial Black', Arial, sans-serif; --fx:'Inter', Arial, sans-serif;
  }
  html,body{margin:0;padding:0;overflow:hidden;background:transparent;}
  #escena{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;}
  #fondoVerde{position:absolute;inset:0;background:#00FF00;display:none;}
  body.verde #fondoVerde{display:block;}
  #fondoEspacio{position:absolute;inset:0;background:var(--espacio);display:none;overflow:hidden;}
  body.fondo-espacio #fondoEspacio{display:block;}
  #fondoEspacio canvas,.mxFondo canvas{position:absolute;left:0;top:0;animation:deriva 60s linear infinite;}
  .mxFondo{position:absolute;inset:0;opacity:0;transition:opacity .6s;}
  .mxFondo.on{opacity:1;}
  .mxFondo svg{position:absolute;left:0;top:0;width:1920px;height:1080px;}
  .escena-sesion{overflow:visible;}
  #estadoRed{position:absolute;left:8px;bottom:8px;font:600 14px Inter,Arial;color:#fff;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;display:none;z-index:9}
  body.debug #estadoRed{display:block}
  .capa{position:absolute;inset:0;pointer-events:none;}

  /* ---------- ABDUCCIÓN ---------- */
  .abd{position:absolute;inset:0;}
  svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;}
  .grp{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .barra{position:absolute;box-sizing:border-box;border-radius:6px;background:var(--espacio);}
  .barra .linea{position:absolute;left:0;right:0;top:0;height:5px;background:var(--violeta);border-radius:6px 6px 0 0;}
  .barra .acento{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--magenta);border-radius:6px 0 0 6px;}
  .barra .icono{position:absolute;top:50%;transform:translateY(-50%);}
  .titulo{position:absolute;white-space:nowrap;font-family:var(--ft);font-weight:700;color:var(--blanco);letter-spacing:.02em;line-height:1;}
  .subbarra{position:absolute;border-radius:4px;background:var(--violeta);}
  .subtitulo{position:absolute;white-space:nowrap;font-family:var(--fx);font-weight:700;color:var(--blanco);letter-spacing:.08em;text-transform:uppercase;line-height:1;}
  .etiqueta{position:absolute;height:38px;padding:0 18px;display:flex;align-items:center;border-radius:4px;font-family:var(--ft);font-weight:700;font-size:21px;letter-spacing:.14em;white-space:nowrap;}
  .ilus{position:absolute;}
  .ufo{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;}
  .ufo svg{position:absolute;left:-140px;top:-100px;width:280px;height:150px;overflow:visible;}
  body:not(.verde) .ufo svg, body:not(.verde) svg.rayo{filter:drop-shadow(0 0 10px rgba(123,47,247,.85)) drop-shadow(0 0 22px rgba(255,244,194,.35));}

  /* ---------- ESPACIO (apertura/cierre) ---------- */
  .espacio{position:absolute;inset:0;background:var(--espacio);opacity:0;transition:opacity .6s;}
  .espacio.on{opacity:1;}
  .espacio canvas{position:absolute;left:0;top:0;animation:deriva 30s linear infinite;}
  @keyframes deriva{from{transform:translateX(0)}to{transform:translateX(-420px)}}

  /* ---------- VENTANAS (duplex / triplex) ---------- */
  .ventana{position:absolute;}
  .ventana svg{position:absolute;inset:-6px;overflow:visible;}
  .ventana rect{fill:none;}
  .etq{position:absolute;height:46px;display:flex;align-items:center;padding:0 22px 0 26px;background:var(--espacio);border-radius:4px;
       font-family:var(--ft);font-weight:700;font-size:22px;letter-spacing:.08em;color:var(--blanco);white-space:nowrap;
       opacity:0;transform:translateY(10px);transition:opacity .35s, transform .35s;}
  .etq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--magenta);border-radius:4px 0 0 4px;}
  .etq.on{opacity:1;transform:none;}
  .sesion{position:absolute;left:96px;top:54px;height:46px;display:flex;align-items:center;gap:14px;padding:0 18px 0 16px;background:var(--espacio);
       border:3px solid var(--violeta);border-radius:23px;font-family:var(--ft);font-weight:700;font-size:19px;letter-spacing:.12em;color:var(--blanco);
       opacity:0;transform:translateX(-30px);transition:opacity .4s, transform .5s;}
  .sesion.on{opacity:1;transform:none;}
  .sesion i{width:12px;height:12px;border-radius:50%;background:var(--magenta);animation:parpadeo 1s steps(1) infinite;}
  .sesion b{color:var(--rayo);font-weight:700;min-width:70px;}
  .sesion svg{width:90px;height:30px;}

  /* ---------- BUG ---------- */
  .bug{position:absolute;right:96px;top:54px;width:360px;height:112px;transform-origin:100% 0;}
  .bug .placa{position:absolute;inset:0;background:var(--espacio);border:4px solid var(--violeta);border-radius:56px;box-sizing:border-box;}
  .bug .l1,.bug .l2{position:absolute;left:120px;font-family:var(--ft);font-weight:700;font-size:30px;letter-spacing:.06em;line-height:1;white-space:nowrap;}
  .bug .l1{top:24px;color:var(--blanco);} .bug .l2{top:60px;color:var(--menta);}
  .bug img{position:absolute;left:110px;top:10px;height:92px;max-width:230px;object-fit:contain;}
  .bug .vivo{position:absolute;right:0;top:128px;height:38px;padding:0 18px 0 36px;border-radius:19px;background:var(--magenta);display:flex;align-items:center;
       font-family:var(--ft);font-weight:700;font-size:18px;letter-spacing:.12em;color:var(--blanco);}
  .bug .vivo::before{content:"";position:absolute;left:14px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--blanco);animation:parpadeo 1s steps(1) infinite;}
  @keyframes parpadeo{50%{opacity:.2}}
  .bug{transition:opacity .4s, transform .5s cubic-bezier(.2,1.4,.4,1);}
  .bug.fuera{opacity:0;transform:scale(.2) translateY(-60px);}

  /* ---------- LUGAR (esquina superior derecha de los titulares) ---------- */
  .lugar{position:absolute;right:96px;top:54px;height:112px;display:flex;align-items:center;gap:16px;padding:0 34px 0 22px;background:var(--espacio);
       border:4px solid var(--violeta);border-radius:56px;box-sizing:border-box;transform-origin:100% 0;transition:opacity .4s, transform .55s cubic-bezier(.2,1.4,.4,1);}
  .lugar.fuera{opacity:0;transform:scale(.2) translateY(-60px);}
  .lugar svg{width:46px;height:62px;flex:0 0 auto}
  .lugar .t1{font-family:var(--ft);font-weight:700;font-size:34px;letter-spacing:.04em;color:var(--blanco);line-height:1;white-space:nowrap}
  .lugar .t2{font-family:var(--fx);font-weight:700;font-size:19px;letter-spacing:.12em;color:var(--menta);text-transform:uppercase;margin-top:8px;white-space:nowrap}
  .lugar .txt{transition:opacity .25s}
  .abortando{transition:opacity .3s;opacity:0!important}

  /* ---------- TICKER ---------- */
  .ticker{position:absolute;left:0;right:0;bottom:18px;height:52px;background:var(--espacio);border-top:4px solid var(--violeta);
       display:flex;align-items:center;overflow:hidden;transform:translateY(90px);transition:transform .6s cubic-bezier(.3,1.3,.5,1);}
  .ticker.on{transform:none;}
  .ticker .etiq{position:relative;z-index:2;height:100%;padding:0 26px;display:flex;align-items:center;background:var(--magenta);
       font-family:var(--ft);font-weight:700;font-size:22px;letter-spacing:.1em;color:var(--blanco);white-space:nowrap;}
  .ticker .cinta{white-space:nowrap;font-family:var(--fx);font-weight:600;font-size:26px;color:var(--blanco);padding-left:40px;}

  /* ---------- CORTINA ---------- */
  .panelC{position:absolute;top:0;bottom:0;left:0;}
  .cortTexto{position:absolute;left:0;right:0;top:500px;text-align:center;font-family:var(--ft);font-weight:900;font-size:110px;letter-spacing:.06em;color:var(--blanco);opacity:0;}

  /* =================================================================
     ENTRE OVNIS Y FANTASMAS — FUSIÓN: motor ovni/rayo del programa anterior + gráfica nueva (AE)
     ================================================================= */
  :root{--e-carbon:#17171C;--e-carbon2:#2A2A31;--e-verde:#7CC242;--e-naranjo:#FF7A1A;--e-rojo:#C8102E;--e-blanco:#fff;--e-hueso:#E9E2D0;
        --e-ft:'Cinzel', Georgia, serif;--e-tx:'Montserrat', Arial, sans-serif;--e-exp:'Special Elite', 'Courier New', monospace;}
  body.eoyf.e-azul #fondoVerde{display:block;background:#0000FF}
  body.eoyf.e-verde #fondoVerde{display:block;background:#00FF00}
  /* barras del tercio inferior: carbón en diagonal con franjas ///, acento verde alien o naranjo calabaza */
  .abd.eoyf .barra{border-radius:0;clip-path:polygon(22px 0,100% 0,calc(100% - 22px) 100%,0 100%);
       box-shadow:inset 0 -3px 0 rgba(255,255,255,.06);background-image:linear-gradient(180deg,rgba(255,255,255,.07),transparent 60%)!important}
  .abd.eoyf .barra .linea{height:4px;border-radius:0}
  .abd.eoyf .barra .acento{width:46px;border-radius:0;background:repeating-linear-gradient(115deg,var(--ac,var(--e-verde)) 0 9px,transparent 9px 15px)!important}
  .abd.eoyf.t-ovni .barra .acento{--ac:var(--e-verde)} .abd.eoyf.t-fantasma .barra .acento{--ac:var(--e-naranjo)} .abd.eoyf.t-neutro .barra .acento{--ac:var(--e-rojo)}
  .abd.eoyf .titulo{font-family:var(--e-ft);font-weight:700;letter-spacing:.05em;
       text-shadow:2px 0 rgba(255,0,60,.5),-2px 0 rgba(0,255,220,.4),0 3px 10px rgba(0,0,0,.6)}
  .abd.eoyf .subbarra{border-radius:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
  .abd.eoyf .subtitulo{font-family:var(--e-tx);font-weight:800;letter-spacing:.14em}
  .abd.eoyf .etiqueta{border-radius:0;font-family:var(--e-tx);font-weight:800;font-size:19px;letter-spacing:.18em;
       clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);padding:0 26px}
  .abd.eoyf .barra .icono{filter:drop-shadow(0 0 6px rgba(0,0,0,.7))}
  .abd.eoyf .recDot{animation:parpadeo 1s steps(1) infinite}
  .abd.eoyf .ilus{filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
  .abd.eoyf img.ilus{max-width:460px;max-height:200px!important;object-fit:contain}
  body.eoyf:not(.e-azul):not(.e-verde) .abd.eoyf.t-ovni .ufo svg{filter:drop-shadow(0 0 12px rgba(124,194,66,.9)) drop-shadow(0 0 26px rgba(217,255,176,.4))}
  body.eoyf:not(.e-azul):not(.e-verde) .abd.eoyf.t-fantasma .ufo svg{filter:drop-shadow(0 0 14px rgba(255,180,120,.85)) drop-shadow(0 0 30px rgba(255,255,255,.35))}

  /* tarjeta lateral de dato (Maitenes / Colbún) con el ovni o el fantasma que la ilumina */
  .eTarjeta{position:absolute;right:110px;top:210px;width:620px;opacity:0;transform:translateX(90px) skewX(-6deg);filter:blur(6px);
       transition:opacity .45s, transform .6s cubic-bezier(.2,1.3,.4,1), filter .4s}
  .eTarjeta.on{opacity:1;transform:none;filter:none;animation:eGlitch .5s steps(2) .15s 1}
  .eTarjeta.sale{opacity:0;transform:translateY(-140px) scale(.4);filter:blur(10px);transition:opacity .5s, transform .6s cubic-bezier(.6,0,.8,.3), filter .5s}
  .eCaja{position:relative;padding:30px 34px 34px;background:linear-gradient(180deg,rgba(23,23,28,.94),rgba(23,23,28,.88)),url(eoyf/textura.jpg) center/cover;
       border-left:12px solid var(--ac);clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .eTarjeta.ovni{--ac:var(--e-verde)} .eTarjeta.fantasma{--ac:var(--e-naranjo)} .eTarjeta.neutro{--ac:var(--e-rojo)}
  .eCab{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .eCab svg{flex:0 0 auto}
  .eEtq{background:var(--ac);color:#111;font:800 17px/1 var(--e-tx);letter-spacing:.2em;padding:8px 14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
  .eCab b{flex:1 1 100%;font:700 42px/1.05 var(--e-ft);color:#fff;letter-spacing:.03em;text-shadow:2px 0 rgba(255,0,60,.45),-2px 0 rgba(0,255,220,.35)}
  .eCaja p{margin:0;font:400 30px/1.38 var(--e-exp);color:var(--e-hueso)}
  .eSello{position:absolute;right:26px;bottom:18px;font:900 22px/1 var(--e-ft);letter-spacing:.2em;color:var(--e-rojo);border:3px solid var(--e-rojo);padding:6px 10px;transform:rotate(-8deg);opacity:.55;font-style:normal}
  .eSer{position:absolute;left:50%;top:-150px;width:0;height:0;animation:eFlota 3.2s ease-in-out infinite}
  .eSer svg{position:absolute;left:-112px;top:-80px;width:224px;height:120px;overflow:visible}
  .eTarjeta.ovni .eSer svg{filter:drop-shadow(0 0 12px rgba(124,194,66,.9))} .eTarjeta.fantasma .eSer svg{filter:drop-shadow(0 0 14px rgba(255,180,120,.9))}
  .eHaz{position:absolute;left:50%;top:-140px;width:560px;height:180px;transform:translateX(-50%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
       background:linear-gradient(180deg,rgba(217,255,176,.55),rgba(217,255,176,0));animation:eHaz 2.2s ease-in-out infinite}
  .eTarjeta.fantasma .eHaz{background:linear-gradient(180deg,rgba(255,226,194,.5),rgba(255,226,194,0))}
  body.eoyf.e-azul .eHaz, body.eoyf.e-verde .eHaz{opacity:.9;background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 40px)!important}
  @keyframes eFlota{50%{transform:translateY(-12px) rotate(3deg)}}
  @keyframes eHaz{50%{opacity:.6}}
  @keyframes eGlitch{0%{transform:translateX(-10px);filter:hue-rotate(80deg) contrast(1.6)}50%{transform:translateX(8px) skewX(4deg);filter:invert(.15)}100%{transform:none}}

  /* marca de agua: logo del programa con el platillo flotando y un parpadeo espectral cada tanto */
  .eMarca{position:absolute;right:60px;top:36px;width:290px;opacity:0;transform:translateY(-30px) scale(.8);transition:opacity .6s, transform .7s cubic-bezier(.2,1.4,.4,1)}
  .eMarca.on{opacity:var(--op,.85);transform:none}
  .eMarca img{width:100%;display:block;filter:drop-shadow(0 0 8px rgba(0,0,0,.8)) drop-shadow(0 0 14px rgba(124,194,66,.35));animation:eFlota 4s ease-in-out infinite, eEspectral 9s steps(1) infinite}
  @keyframes eEspectral{0%,91%,100%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.5}96%{opacity:1}}

  /* ticker de noticias paranormales del Maule */
  .eTicker{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:stretch;background:var(--e-carbon);
       border-top:4px solid;border-image:linear-gradient(90deg,var(--e-verde),var(--e-naranjo)) 1;transform:translateY(110px);transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
  .eTicker.on{transform:none}
  .eTkEtq{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:0 40px 0 22px;background:var(--e-verde);color:#0E1A06;
       clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%)}
  .eTkEtq b{font:900 25px/1 var(--e-ft);letter-spacing:.06em;white-space:nowrap}
  .eTkFecha{position:relative;z-index:2;display:flex;align-items:center;margin-left:-20px;padding:0 34px 0 36px;background:var(--e-naranjo);color:#1C0B00;
       font:800 18px/1 var(--e-tx);letter-spacing:.12em;white-space:nowrap;clip-path:polygon(24px 0,100% 0,calc(100% - 24px) 100%,0 100%)}
  .eTkVia{flex:1;position:relative;overflow:hidden;margin-left:-10px}
  .eTkCinta{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;padding-left:30px}
  .eTkIt{display:inline-flex;align-items:center;gap:14px;margin-right:56px;font:700 27px/1 var(--e-tx);color:#fff;text-transform:uppercase;letter-spacing:.02em}
  .eTkFin{position:relative;z-index:2;width:150px;background:linear-gradient(90deg,transparent,var(--e-carbon) 30%)}

  /* cortinas cortas */
  .eCielo{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#1F3A10,#050805 70%)}
  .eCielo canvas{position:absolute;left:0;top:0;animation:deriva 6s linear infinite}
  .eCortLogo{position:absolute;left:50%;top:58%;width:980px;opacity:0;filter:drop-shadow(0 0 20px rgba(0,0,0,.9))}
  .eGlitch{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;opacity:0}
  .eNiebla{position:absolute;inset:-10%;background:radial-gradient(circle at 50% 55%,rgba(60,20,70,.6),rgba(8,0,10,.97) 62%),url(eoyf/textura.jpg) center/cover;background-blend-mode:multiply}
  .eFant{position:absolute;left:50%;top:50%;filter:drop-shadow(0 0 30px rgba(255,255,255,.6))}
  .eMano{position:absolute;left:24%;bottom:0;width:420px;transform-origin:50% 100%}

  /* triplex alien / duplex fantasmas: ventanas del programa anterior con fondo nuevo */
  .eMxFondo{position:absolute;inset:0;background:#050805}
  .eMxFondo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.1) brightness(.75)}
  .eMxTinte{position:absolute;inset:0;background:linear-gradient(180deg,rgba(124,194,66,.18),rgba(0,0,0,.45))}
  .eMxTinte canvas{position:absolute;left:0;top:0;opacity:.6}
  .eMxFondo.noche{background:radial-gradient(circle at 74% 20%,#FFF3E0 0 92px,rgba(255,190,140,.45) 93px 150px,transparent 151px),
       linear-gradient(180deg,#2B0004 0%,#7A0A0A 55%,#160002 100%)}
  .eMurc{position:absolute;inset:0;width:100%;height:100%}
  .eMurc g{animation:eVuelo 7s linear infinite}
  @keyframes eVuelo{from{transform:translate(-120px,var(--y)) scale(.9)}50%{transform:translate(960px,calc(var(--y) - 60px)) scale(1.1)}to{transform:translate(2100px,var(--y)) scale(.9)}}
  .eTriplex .etq,.eDuplex .etq{font-family:var(--e-ft);background:var(--e-carbon);letter-spacing:.06em;border-radius:0;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
  .eTriplex .etq::before{background:var(--e-verde);border-radius:0} .eDuplex .etq::before{background:var(--e-naranjo);border-radius:0}
  .eTriplex .sesion,.eDuplex .sesion{display:none}
</style>
</head>
<body class="verde">
<div id="escena">
  <div id="fondoVerde"></div>
  <div id="fondoEspacio"></div>
  <div class="capa" id="cEspacio"></div>
  <div class="capa" id="cVentanas"></div>
  <div class="capa" id="cGraficas"></div>
  <div class="capa" id="cEOYF"></div>
  <div class="capa" id="cTicker"></div>
  <div class="capa" id="cBug"></div>
  <div class="capa" id="cCortina"></div>
</div>
<div id="estadoRed">conectando…</div>

<script src="config.js?v=320"></script>
<script src="comun.js?v=320"></script>
<script src="eoyf-datos.js?v=320"></script>
<script src="conexion.js?v=320"></script>
<script src="escena.js?v=320"></script>
<script src="eoyf.js?v=320"></script>
<script>
/* ===================================================================
   MOTOR DE ANIMACIÓN — replica las llaves del script de After Effects
   =================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
let E = TE.copia(TE.ESTADO_BASE);
const cfg = () => E.config;
const ahora = () => performance.now() / 1000;
const $ = (s, p = document) => p.querySelector(s);
function el(tag, cls, padre) { const e = document.createElement(tag); if (cls) e.className = cls; if (padre) padre.appendChild(e); return e; }
function sv(tag, attrs, padre) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (padre) padre.appendChild(e); return e; }
function ease(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function pista(keys, t, lineal) {
  if (t <= keys[0][0]) return keys[0][1];
  const u = keys[keys.length - 1]; if (t >= u[0]) return u[1];
  let i = 0; while (t > keys[i + 1][0]) i++;
  const [ta, va] = keys[i], [tb, vb] = keys[i + 1];
  let f = (t - ta) / (tb - ta); if (!lineal) f = ease(f);
  return Array.isArray(va) ? va.map((v, j) => v + (vb[j] - v) * f) : va + (vb - va) * f;
}
const PARAMS = new URLSearchParams(location.search);
const FORZAR_FONDO = PARAMS.get('verde') === '1' ? 'verde' : (PARAMS.get('fondo') || null);

// Estrellas (canvas) para los fondos de espacio

    if (o.icono) {

    if (this.stx.textContent !== (s || '').toUpperCase()) { this.stx.textContent = (s || '').toUpperCase(); this.fsS = this.o.tamS; this.stx.style.fontSize = this.fsS + 'px'; }

// devuelve una promesa con .abortar() para sacarla antes de tiempo (fundido de 0,3 s)
function animar(dur, raiz, fn) {
  const t0 = ahora(); let cortar = false, listo;
  const pr = new Promise(res => {
    listo = res;
    (function paso() {
      const t = (ahora() - t0) * cfg().velocidad;
      if (cortar) return;
      if (t > dur) { raiz.remove(); res(); return; }
      fn(t); requestAnimationFrame(paso);
    })();
  });
  pr.abortar = () => { if (cortar) return; raiz.classList.add('abortando'); setTimeout(() => { cortar = true; raiz.remove(); listo(); }, 320); };
  return pr;
}

const slots = {};
async function cambiarSlot(nombre, clave, crear) {
  const actual = slots[nombre];
  if (actual && actual.clave === clave) return;
  slots[nombre] = { clave, pieza: null };
  if (actual && actual.pieza) await actual.pieza.salir();
  if (slots[nombre].clave !== clave) return;
  if (clave !== null && clave !== false) slots[nombre].pieza = crear();
}

function fondoEfectivo() {
  const a = E.aire, pedidos = [];
  if (a.gc !== null && a.gc !== undefined && E.gcs[a.gc]) pedidos.push(E.gcs[a.gc].fondo);
  if (a.titular !== null && a.titular !== undefined) pedidos.push(a.titular < 0 ? E.textos.avance.fondo : (E.titulares[a.titular] || {}).fondo);
  ['cortinaTitulo', 'aviso', 'volvemos'].forEach(k => { if (a[k]) pedidos.push(E.textos[k].fondo); });
  if (pedidos.includes('espacio')) return 'espacio';
  if (pedidos.includes('verde')) return 'verde';
  return FORZAR_FONDO || cfg().fondo;
}
function aplicarConfig() {

function aplicar(nuevo) {

  const a = E.aire, tx = E.textos;

  const g = a.gc !== null && a.gc !== undefined ? E.gcs[a.gc] : null;
  const claveGC = g ? a.gc + '|' + (g.icono || '') : null;
  if (slots.gc && slots.gc.pieza && g && slots.gc.clave === claveGC) {

  }
  // Avance informativo: -1 = portada, 0..n = titular

  if (slots.titular && slots.titular.pieza && slots.titular.clave === claveT) {

  } else {

    if (on && slots[n] && slots[n].pieza) { slots[n].pieza.textos(t.titulo, t.sub); return; }
    cambiarSlot(n, on ? n : null, () => new Abduccion(Object.assign(conf(n), { titulo: t.titulo, sub: t.sub }), $('#cGraficas')));
  });
  ['triplex', 'duplex'].forEach(n => {
    const t = tx[n];
    const clave = a[n] ? n + '|' + t.titulo + '|' + t.etiquetas.join(',') : null;
    cambiarSlot(n, clave, () => new Multiplex(VENTANAS[n], t.etiquetas, t.titulo));
  });
  const h = (ti !== null && ti !== undefined && ti >= 0) ? E.titulares[ti] : null;
  const hayLugar = lugar(h && h.lugar ? h.lugar : '');
  bug(!!a.bug && !hayLugar);           // el lugar ocupa la esquina del bug mientras está al aire
  ticker(!!a.ticker);
  // gráficas con duración: entran con un toque y se pueden sacar con otro
  ['apertura', 'cierre', 'cortina', 'transicion'].forEach(k => {
    const v = a[k], id = v && v.id, cur = enCurso[k];
    if (primeraVez) { if (id) enCurso[k] = { id, pr: null }; return; }   // al abrir OBS no relanza lo viejo
    if (id && (!cur || cur.id !== id)) {
      if (cur && cur.pr) cur.pr.abortar();
      const pr = lanzar(k, v.variante);
      enCurso[k] = { id, pr };
      pr.then(() => { if (enCurso[k] && enCurso[k].pr === pr) enCurso[k] = null; });
    } else if (!id && cur) {
      if (cur.pr) cur.pr.abortar();
      enCurso[k] = null;
    }
  });
  primeraVez = false;
  EOYF_SAL.aplicar(E);
}
const enCurso = {};
let primeraVez = true;

function lanzar(que, variante) {
  const tx = E.textos;
  if (que === 'cortina') return cortina();
  if (que === 'transicion') return transicion(variante);
  // apertura / cierre
  espacio(true);
  const p = new Abduccion(Object.assign(conf(que), { titulo: tx[que].titulo, sub: tx[que].sub }), $('#cGraficas'));
  const pr = p.fin.then(() => espacio(false));
  pr.abortar = () => { espacio(false); p.abortar(); };
  return pr;
}
function disparar(que, variante) { return lanzar(que, variante); }   // para pruebas desde la consola

/* ===================================================================
   BUCLE Y CONEXIÓN
   =================================================================== */
function bucle() {
  const now = ahora();
  Abduccion.vivos.forEach(p => p.tick(now));
  document.querySelectorAll('.escena-sesion').forEach(sv => TE_ESCENA.animar(sv, now));
  document.querySelectorAll('.ufo[data-bug]').forEach(u => {
    u.style.transform = `translate(58px,${58 + Math.sin(now * 3) * 5}px) rotate(${Math.sin(now * 2.2) * 6}deg) scale(.4)`;
    const l = u.querySelector('.luces'); if (l) l.style.opacity = Math.floor(now * 4) % 2 ? .35 : 1;
  });
  requestAnimationFrame(bucle);
}
function ajustar() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#escena').style.transform = `scale(${s})`;
}
addEventListener('resize', ajustar);

if (PARAMS.has('debug')) document.body.classList.add('debug');
(async function iniciar() {
  ajustar();
  aplicar(TE.copia(TE.ESTADO_BASE));
  primeraVez = true;
  bucle();
  if (PARAMS.has('demo')) { const d = TE.copia(E); d.aire.gc = 0; d.aire.bug = true; aplicar(d); return; }
  const con = await TE_RT.abrir('salida');
  con.on('estado', est => aplicar(TE.normalizar(est)));
  con.on('red', (r, msg) => { $('#estadoRed').textContent = con.modo + ' · ' + r + (msg ? ' · ' + msg : ''); });
  try { await con.conectar(); }
  catch (e) { $('#estadoRed').textContent = 'Error: ' + e.message; document.body.classList.add('debug'); }
})();
</script>
