<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" data-nombre="ESCENA_SESION">
  <!-- Escena de sesión: terapeuta (mujer) + paciente alien conversando.
       Solo usa rect, circle, ellipse, line y path (M L C Z absolutos) para poder convertirse a capas de forma en After Effects.
       Colores: variables CSS de la paleta del programa. Los <g data-anim> se animan en HTML y en AE. -->

  <!-- ===== DIVÁN ===== -->
  <rect x="60" y="112" width="390" height="120" rx="46" fill="var(--violetaOsc)" stroke="var(--blanco)" stroke-width="5"/>
  <rect x="70" y="214" width="370" height="80" rx="18" fill="var(--violeta)" stroke="var(--blanco)" stroke-width="5"/>
  <path d="M86,240 L424,240" fill="none" stroke="var(--blanco)" stroke-width="3"/>
  <rect x="96" y="291" width="18" height="34" rx="4" fill="var(--espacio)" stroke="var(--blanco)" stroke-width="4"/>
  <rect x="396" y="291" width="18" height="34" rx="4" fill="var(--espacio)" stroke="var(--blanco)" stroke-width="4"/>
  <rect x="22" y="122" width="78" height="174" rx="39" fill="var(--violeta)" stroke="var(--blanco)" stroke-width="5"/>
  <circle cx="61" cy="162" r="20" fill="none" stroke="var(--blanco)" stroke-width="3"/>
  <rect x="410" y="122" width="78" height="174" rx="39" fill="var(--violeta)" stroke="var(--blanco)" stroke-width="5"/>
  <circle cx="449" cy="162" r="20" fill="none" stroke="var(--blanco)" stroke-width="3"/>

  <!-- ===== PACIENTE ALIEN (recostado, despierto, contando su historia) ===== -->
  <!-- piernas sobre el apoyabrazos izquierdo -->
  <path d="M236,206 L138,176 L66,124" fill="none" stroke="var(--blanco)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236,206 L138,176 L66,124" fill="none" stroke="var(--pantalon)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="54" cy="112" rx="17" ry="11" fill="var(--menta)" stroke="var(--blanco)" stroke-width="4"/>
  <!-- torso con suéter -->
  <path d="M222,180 C262,160 362,160 404,172 C420,178 420,214 400,222 C340,232 262,232 222,222 C206,214 206,190 222,180 Z" fill="var(--magenta)" stroke="var(--blanco)" stroke-width="5"/>
  <!-- brazo sobre el pecho -->
  <path d="M334,192 C318,208 292,210 276,202" fill="none" stroke="var(--blanco)" stroke-width="22" stroke-linecap="round"/>
  <path d="M334,192 C318,208 292,210 276,202" fill="none" stroke="var(--magenta)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="272" cy="200" r="10" fill="var(--menta)" stroke="var(--blanco)" stroke-width="4"/>
  <!-- brazo levantado que gesticula (gira desde el hombro 372,178) -->
  <g data-anim="gesto" data-ox="372" data-oy="178">
    <path d="M372,178 L346,112 L300,72" fill="none" stroke="var(--blanco)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372,178 L346,112 L300,72" fill="none" stroke="var(--magenta)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="294" cy="66" r="13" fill="var(--menta)" stroke="var(--blanco)" stroke-width="4"/>
    <path d="M286,58 L276,46" fill="none" stroke="var(--blanco)" stroke-width="5" stroke-linecap="round"/>
    <path d="M296,54 L294,40" fill="none" stroke="var(--blanco)" stroke-width="5" stroke-linecap="round"/>
    <path d="M305,58 L312,46" fill="none" stroke="var(--blanco)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- cabeza de alien sobre el apoyabrazos derecho, mirando a la terapeuta -->
  <g data-anim="cabezaAlien" data-ox="436" data-oy="132">
    <path d="M436,82 C466,82 480,104 476,126 C472,150 452,168 436,172 C420,168 400,150 396,126 C392,104 406,82 436,82 Z" fill="var(--menta)" stroke="var(--blanco)" stroke-width="5"/>
    <ellipse cx="422" cy="128" rx="14" ry="9" fill="var(--espacio)"/>
    <ellipse cx="454" cy="128" rx="14" ry="9" fill="var(--espacio)"/>
    <circle cx="427" cy="126" r="3.5" fill="var(--blanco)"/>
    <circle cx="459" cy="126" r="3.5" fill="var(--blanco)"/>
    <path d="M412,116 L430,110" fill="none" stroke="var(--espacio)" stroke-width="3" stroke-linecap="round"/>
    <path d="M446,110 L464,116" fill="none" stroke="var(--espacio)" stroke-width="3" stroke-linecap="round"/>
    <!-- boca abierta: habla -->
    <g data-anim="boca" data-ox="438" data-oy="153">
      <ellipse cx="438" cy="153" rx="8" ry="6" fill="var(--espacio)"/>
    </g>
  </g>
  <!-- globo de diálogo: cuenta su abducción -->
  <g data-anim="globo" data-ox="452" data-oy="80">
    <path d="M470,66 L452,98 L496,70 Z" fill="var(--espacio)" stroke="var(--blanco)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="452" y="4" width="148" height="70" rx="24" fill="var(--espacio)" stroke="var(--blanco)" stroke-width="5"/>
    <path d="M478,38 C478,22 506,22 506,38" fill="var(--espacio)" stroke="var(--rayo)" stroke-width="4"/>
    <ellipse cx="492" cy="40" rx="24" ry="7" fill="var(--espacio)" stroke="var(--rayo)" stroke-width="4"/>
    <path d="M486,48 L478,62 M498,48 L506,62" fill="none" stroke="var(--rayo)" stroke-width="3" stroke-linecap="round"/>
    <path d="M528,30 L580,30" fill="none" stroke="var(--rayo)" stroke-width="5" stroke-linecap="round"/>
    <path d="M528,44 L570,44" fill="none" stroke="var(--rayo)" stroke-width="5" stroke-linecap="round"/>
    <path d="M528,58 L556,58" fill="none" stroke="var(--rayo)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ===== TERAPEUTA (mujer, sentada, toma notas) ===== -->
  <!-- silla -->
  <rect x="690" y="128" width="26" height="150" rx="10" fill="var(--violetaClaro)" stroke="var(--blanco)" stroke-width="5"/>
  <path d="M594,272 L584,350 M694,272 L704,350" fill="none" stroke="var(--blanco)" stroke-width="7" stroke-linecap="round"/>
  <rect x="574" y="250" width="140" height="24" rx="10" fill="var(--violetaClaro)" stroke="var(--blanco)" stroke-width="5"/>
  <!-- piernas cruzadas -->
  <path d="M662,268 L606,276 L612,344" fill="none" stroke="var(--blanco)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M662,268 L606,276 L612,344" fill="none" stroke="var(--pantalon)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M664,252 L570,250 L578,338" fill="none" stroke="var(--blanco)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M664,252 L570,250 L578,338" fill="none" stroke="var(--pantalon)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="568" cy="344" rx="22" ry="9" fill="var(--magenta)" stroke="var(--blanco)" stroke-width="4"/>
  <ellipse cx="606" cy="350" rx="20" ry="8" fill="var(--magenta)" stroke="var(--blanco)" stroke-width="4"/>
  <!-- pelo largo (detrás) -->
  <path data-icono="terapeuta" d="M608,116 C598,70 640,52 670,72 C696,92 700,152 684,196 L664,190 C670,150 662,108 640,100 C626,98 614,108 612,128 Z" fill="var(--pelo)" stroke="var(--blanco)" stroke-width="4"/>
  <!-- torso con blusa -->
  <path d="M614,254 C606,214 610,170 630,152 C646,144 664,148 672,164 C682,198 680,236 672,256 Z" fill="var(--rayo)" stroke="var(--blanco)" stroke-width="5"/>
  <path d="M640,152 L644,172 L652,152" fill="none" stroke="var(--violeta)" stroke-width="4" stroke-linejoin="round"/>
  <rect x="633" y="134" width="18" height="20" rx="6" fill="var(--piel)" stroke="var(--blanco)" stroke-width="4"/>
  <!-- cabeza (asiente) -->
  <g data-icono="terapeuta" data-anim="cabezaTerapeuta" data-ox="642" data-oy="140">
    <circle cx="640" cy="112" r="30" fill="var(--piel)" stroke="var(--blanco)" stroke-width="5"/>
    <path d="M610,108 C614,82 648,74 668,94 C650,88 628,92 612,112 Z" fill="var(--pelo)" stroke="var(--blanco)" stroke-width="3"/>
    <circle cx="666" cy="70" r="15" fill="var(--pelo)" stroke="var(--blanco)" stroke-width="4"/>
    <circle cx="627" cy="114" r="9" fill="none" stroke="var(--espacio)" stroke-width="3"/>
    <circle cx="651" cy="114" r="9" fill="none" stroke="var(--espacio)" stroke-width="3"/>
    <path d="M636,114 L642,114" fill="none" stroke="var(--espacio)" stroke-width="3"/>
    <circle cx="625" cy="115" r="2.5" fill="var(--espacio)"/>
    <circle cx="649" cy="115" r="2.5" fill="var(--espacio)"/>
    <path d="M630,128 C636,133 644,133 648,128" fill="none" stroke="var(--espacio)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- libreta y brazos -->
  <rect x="586" y="188" width="52" height="66" rx="6" fill="var(--blanco)" stroke="var(--espacio)" stroke-width="3"/>
  <rect x="602" y="182" width="20" height="10" rx="3" fill="var(--violeta)"/>
  <path d="M594,206 L628,206 M594,218 L626,218 M594,230 L620,230" fill="none" stroke="var(--violeta)" stroke-width="3" stroke-linecap="round"/>
  <path d="M630,162 L606,214" fill="none" stroke="var(--blanco)" stroke-width="22" stroke-linecap="round"/>
  <path d="M630,162 L606,214" fill="none" stroke="var(--rayo)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="604" cy="218" r="9" fill="var(--piel)" stroke="var(--blanco)" stroke-width="3"/>
  <!-- mano que escribe (lápiz) -->
  <g data-anim="lapiz" data-ox="664" data-oy="166">
    <path d="M664,166 L630,222" fill="none" stroke="var(--blanco)" stroke-width="22" stroke-linecap="round"/>
    <path d="M664,166 L630,222" fill="none" stroke="var(--rayo)" stroke-width="14" stroke-linecap="round"/>
    <path d="M630,226 L614,240" fill="none" stroke="var(--magenta)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="628" cy="226" r="9" fill="var(--piel)" stroke="var(--blanco)" stroke-width="3"/>
  </g>
</svg>
